[project]
name = "silent-dissent"
version = "0.1.0"
description = "Silent dissent: latent vs. stated conformity in multi-agent LLM debate"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.45",
    "accelerate",  # load_model passes device_map
    "datasets>=2.18",
    "numpy",
    "pandas",
    "pyyaml",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["silent_dissent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
