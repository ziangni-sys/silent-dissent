# Main run: Qwen3.5-4B with the official pre-fitted Jacobian lens (no fitting needed).
# Before the full run: python scripts/check_model.py --config configs/qwen35_4b.yaml
model:
  name: Qwen/Qwen3.5-4B
  dtype: bfloat16
  chat_template_kwargs: {enable_thinking: false}   # otherwise the template opens "<think>" before our prefix

lens:
  name: jlens
  kwargs:              # official pre-fitted lens (1000 wikitext sequences), downloaded from the Hub
    repo: neuronpedia/jacobian-lens
    revision: qwen-n1000
    filename: qwen3.5-4b/jlens/Salesforce-wikitext/Qwen3.5-4B_jacobian_lens_n1000.pt

data:
  n_choices: 4
  require_letter_format: true  # drop items whose unrestricted top-1 token is not a letter
  sources:
    - {name: mmlu, split: test, limit: 6000}  # 4000 left only 891 initially-wrong items
    - {name: arc, split: test, limit: 1172}
  n_per_stratum: 1000  # initially-correct and initially-wrong items kept after round 0

seed: 0
batch_size: 16
out_dir: results/qwen35_4b
prereg: prereg/qwen35_4b.json

# Pre-registration rule for the readout layer (applied to round-0 data only).
layer_selection:
  tau: 0.9             # earliest layer whose lens top-1 matches the output on >= 90% of items
  delta: 1.0           # logit margin for the lenient silent-dissent definition

pressure:
  rounds: 3
  grids:
    main:              # the headline conformity grid
      condition: [pressure]
      n_peers: [1, 3, 5]
      peer_style: [answer_only, with_reason]
      target_mode: [wrong, correct]
    controls:          # confound controls at a single setting
      condition: [agree, split, mention_control, remove_original]
      n_peers: [3]
      peer_style: [answer_only]
      target_mode: [wrong, correct]
    positive_control:  # prereg/qwen35_4b_addendum1.json; added after main/controls ran, so run it alone:
      condition: [instructed]  # run_pressure.py --config C --grid positive_control
      n_peers: [0]
      peer_style: [answer_only]
      target_mode: [wrong]

intervention:
  layer: null          # null = prereg layer
  # Set after the --limit 50 pilot, from flip rates only (no lens data): answer-only peers
  # produced no flips, so the causal test uses the strongest-pressure cell instead.
  source: {condition: pressure, n_peers: 5, peer_style: with_reason}
  rounds: [3]          # which pressure rounds to re-run with injection
  alphas: [0.0, 0.05, 0.1, 0.2, 0.4]
  kinds: [original, majority, other, random]
  contrastive: true
  baseline_check: 300  # round-0 items re-run with injection to check for plain letter bias

debate:
  n_items: 500
  n_agents: 3
  rounds: 3
  temperature: 1.0
